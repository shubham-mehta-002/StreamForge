services:

  # ─────────────────────────────
  # MYSQL — Video Metadata DB
  # ─────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: streamforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: streamforge_db
      MYSQL_USER: streamforge
      MYSQL_PASSWORD: streamforge
      TZ: Asia/Kolkata
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - streamforge-network

  # ─────────────────────────────
  # REDIS — Streaming URL Cache
  # ─────────────────────────────
  redis:
    image: redis:7
    container_name: streamforge-redis
    ports:
      - "6379:6379"
    networks:
      - streamforge-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  streamforge-network:
    driver: bridge
